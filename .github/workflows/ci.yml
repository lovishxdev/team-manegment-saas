name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Prisma client is constructed at import time; no queries run in CI.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: WhatsApp agent deterministic tests
        run: npm run test:whatsapp

      - name: Memory layer deterministic tests
        run: npm run test:memory

      - name: Tool registry parity
        run: npm run check:tools
